name: mdlbkp-500
services:
  mariadb:
    image: linuxserver/mariadb:latest
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      #- ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      - MYSQL_DATABASE=moodle
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_CHARACTER_SET=utf8mb4
      - MYSQL_COLLATE=utf8mb4_unicode_ci
    volumes:
      - 'mariadb_data:/config'
    networks:
      - mdl_mariadb_net
  moodle:
    build:
        context: .
        dockerfile: Dockerfile
    ports:
      - '80:8080'
      - '443:8443'
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=moodle
      - MOODLE_DATABASE_NAME=moodle
      - MOODLE_DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=${MOODLE_PASSWORD}
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      #- ALLOW_EMPTY_PASSWORD=yes
      - MOODLE_SMTP_HOST=mailpit
      - MOODLE_SMTP_PORT=1025
      - MOODLE_SMTP_USER=admin
      - MOODLE_SMTP_PASSWORD=${MOODLE_PASSWORD}
      - MOODLE_SMTP_PROTOCOL=
    volumes:
      - 'moodle_data:/bitnami/moodle'
      - 'moodledata_data:/bitnami/moodledata'
    depends_on:
      - mariadb
      - mailpit
    networks:
      - mdl_mariadb_net

  # https://mailpit.axllent.org/
  mailpit: # You need to ensure you map the correct ports (default Web UI on 8025 and SMTP on 1025).
    image: axllent/mailpit:latest
    volumes:
      - 'mailpit_data:/data'
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1 
    networks:
      - mdl_mariadb_net
  phpmyadmin:
    image: linuxserver/phpmyadmin:latest
    ports:
      - '8080:80'
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MARIADB_ROOT_PASSWORD}
    depends_on:
      - mariadb
    networks:
      - mdl_mariadb_net      
  goemaxima:
    image: mathinstitut/goemaxima:2025040100-latest
    ports:
      - "8081:8080" 
    networks:
      - mdl_mariadb_net 
  jobe:
    image: trampgeek/jobeinabox:latest
    restart: always
    ports:
      - '4000:80'
    networks:
      - mdl_mariadb_net 
  vpl_jail:
    image: jcrodriguezvpl/jail-alpine-full:latest
    networks:
      - mdl_mariadb_net
    ports:
      - "8000:80"
    environment:
      - VPL_JAIL_PORT=80
      - VPL_JAIL_URLPATH=/vpl
      - VPL_JAIL_SECURE_PORT=0 # To disable HTTPS set VPL_JAIL_SECURE_PORT=0
    volumes:
      - vpl_data:/var/vpl_jail
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
  redis:
    image: redis:alpine
    networks:
      - mdl_mariadb_net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  lldap:
    image: lldap/lldap:stable
#    container_name: lldap
    restart: unless-stopped
    ports:
      - "17170:17170" # Web UI
      - "3890:3890" # LDAP (uncomment if needed, but consider security)
      # - "6360:6360" # LDAPS (uncomment if LDAPS enabled)
    volumes:
      - lldap_data:/data
      # Alternatively, for local folder:
      # - ./lldap_data:/data
    environment:
      # --- Essential Configuration --
      - LLDAP_LDAP_HOST=0.0.0.0 # Or :: for IPv6-
      - LLDAP_JWT_SECRET=${LLDAP_JWT} # Change this! Generate a strong random string. 
      - LLDAP_LDAP_USER_PASS=${LLDAP_PASSWORD} # admin password for LDAP users
      - LLDAP_LDAP_BASE_DN=dc=mdlbkp,dc=local # Your base DN (e.g., dc=yourdomain,dc=com) cn=admin,dc=mdlbkp,dc=local

      # --- Optional Configuration ---
      # User and Group IDs for the LLDAP process (defaults to 1000)
      - UID=1000
      - GID=1000
      # Timezone
      - TZ=America/Sao_Paulo # Adjust to your timezone (already correct for Curitiba)

      # LDAPS Options (uncomment and configure if enabling LDAPS)
      # - LLDAP_LDAPS_OPTIONS__ENABLED=true
      # - LLDAP_LDAPS_OPTIONS__CERT_FILE=/data/cert.pem
      # - LLDAP_LDAPS_OPTIONS__KEY_FILE=/data/key.pem

      # SMTP Options for Password Reset (configured for Mailpit)
      - LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET=true # Enable password reset functionality
      - LLDAP_SMTP_OPTIONS__SERVER=mailpit # Mailpit service name as the SMTP server hostname
      - LLDAP_SMTP_OPTIONS__PORT=1025 # Mailpit's default SMTP port
      # ADD THIS LINE TO DISABLE TLS/STARTTLS FOR LOCAL MAILPIT
      - LLDAP_SMTP_OPTIONS__TLS=false # Disable TLS/STARTTLS for local Mailpit (not recommended for production)
      - LLDAP_SMTP_OPTIONS__FROM="LLDAP Admin <no-reply@mdlbkp.local>" # Sender email address
    networks:
      - mdl_mariadb_net 
# https://ngrok.com/docs/using-ngrok-with/docker/
#  ngrok:
#    image: ngrok/ngrok:latest
#    command:
#      - "http"
#      - "http://host.docker.internal:80"
#   environment:
#      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
#    ports:
#      - 4040:4040
volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local
  mailpit_data:
    driver: local
  vpl_data:
    driver: local
  redis_data:
    driver: local
  lldap_data:
    driver: local
networks:
  mdl_mariadb_net:
    driver: bridge