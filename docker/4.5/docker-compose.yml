name: mdlbkp-450
services:
  mariadb:
    image: docker.io/bitnami/mariadb:latest
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      #- ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - 'mariadb_data:/bitnami/mariadb'
    networks:
      - mdl_mariadb_net
  moodle:
    #image: docker.io/bitnami/moodle:4.4
    build:
        context: .
        dockerfile: Dockerfile
    ports:
      - '80:8080'
      - '443:8443'
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=${MOODLE_PASSWORD}
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      #- ALLOW_EMPTY_PASSWORD=yes
      - MOODLE_SMTP_HOST=mailpit
      - MOODLE_SMTP_PORT=1025
      - MOODLE_SMTP_USER=admin
      - MOODLE_SMTP_PASSWORD=${MOODLE_PASSWORD}
      - MOODLE_SMTP_PROTOCOL=
    volumes:
      - 'moodle_data:/bitnami/moodle'
      - 'moodledata_data:/bitnami/moodledata'
    depends_on:
      - mariadb
      - mailpit
    networks:
      - mdl_mariadb_net

  # https://mailpit.axllent.org/
  mailpit: # You need to ensure you map the correct ports (default Web UI on 8025 and SMTP on 1025).
    image: axllent/mailpit:latest
    container_name: mailpit
    volumes:
      - 'mailpit_data:/data'
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1 
    networks:
      - mdl_mariadb_net
  phpmyadmin:
    image: docker.io/bitnami/phpmyadmin:5
    ports:
      - '8080:8080'
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MARIADB_ROOT_PASSWORD}
    depends_on:
      - mariadb
    networks:
      - mdl_mariadb_net   
  goemaxima:
    image: mathinstitut/goemaxima:2025040100-latest
    ports:
      - "8081:8080" 
#  jobe:
#    image: trampgeek/jobeinabox:latest
#    restart: always
#    ports:
#      - '4000:80'
# https://ngrok.com/docs/using-ngrok-with/docker/
#  ngrok:
#    image: ngrok/ngrok:latest
#    command:
#      - "http"
#      - "http://host.docker.internal:80"
#   environment:
#      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
#    ports:
#      - 4040:4040
volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local
  mailpit_data:
    driver: local
networks:
  mdl_mariadb_net:
    driver: bridge