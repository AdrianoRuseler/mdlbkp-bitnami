server {
    listen 80;
    server_name localhost; # Listen on localhost

    client_max_body_size 250M; # Adjust as needed for large file uploads

    # Location block for the /n8n subfolder
    location /n8n/ {
        # Rewrite the URL to remove the /n8n prefix before proxying to n8n
        # This makes n8n think it's running at the root, while Nginx handles the subfolder.
        rewrite ^/n8n/(.*)$ /$1 break;

        proxy_pass http://n8n:5678; # Proxy to the n8n service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}