services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=rootpass
      - MARIADB_DATABASE=mydb
      - MARIADB_USER=myuser
      - MARIADB_PASSWORD=mypassword
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend

  php:
    #image: php:8.3-apache
    build: ./php
    container_name: php-apache
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=myuser
      - PMA_PASSWORD=mypassword
    ports:
      - "8081:80"
    depends_on:
      - mariadb
    networks:
      - backend

volumes:
  mariadb_data:

networks:
  backend:
